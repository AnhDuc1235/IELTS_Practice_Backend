services:
  mysql:
    container_name: "IELTS_Pratice-mysql"
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dev1012
      MYSQL_DATABASE: IELTS_Pratice
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pdev1012 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    environment:
      DATABASE_URL: mysql://root:dev1012@mysql:3306/IELTS_Pratice
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
  redis: 
    container_name: "IELTS_Pratice-redis"
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data: