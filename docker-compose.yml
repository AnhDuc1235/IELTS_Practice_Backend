services:
  mysql:
    container_name: "IELTS_Pratice-mysql"
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dev1012
      MYSQL_DATABASE: IELTS_Pratice
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
  redis: 
    container_name: "IELTS_Pratice-redis"
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data: